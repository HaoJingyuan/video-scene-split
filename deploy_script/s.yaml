edition: 3.0.0
name: transnetv2-test
access: "default-volcano" # todo: 在系统下新建火山引擎�?AK / SK 密钥

vars:
  sid: "transnetv2-test"
  region: "cn-beijing"
  functionName: "transnetv2-test-function"

resources:
  transnetv2-test:
    component: volcano-vefaas@1.4.3
    props:
      common:
        Region: ${vars.region}
      function:
        Name: ${vars.functionName}
        Description: "transnetv2-test"
        ExclusiveMode: true
        RequestTimeout: 900
        Runtime: native/v1
        SourceType: image # 支持 image / zip
        Source: dcc-cloud2-cn-beijing.cr.volces.com/dcc-cloud/transnetv2:0.0.1
        MaxConcurrency: 1
        MemoryMB: 8196
        Processor: gpu
        InstanceType: nvidia-tesla-l4
        Envs: 
          - Key: OUT_ROOT
            Value: /mnt/auto/feishu_movie_output/        
          - Key: PORT
            Value: '8000'
        VpcConfig:
          EnableVpc: true
          EnableSharedInternetAccess: true
          VpcId: vpc-rs46tr20ji0wv0x58vge86q
          SubnetIds:
            - subnet-minbd39plbeo5smt1ai7jqqb
          SecurityGroupIds:
            - sg-rs46twz3vny8v0x57j3abxz
        TosMountConfig:
          EnableTos: true
          Credentials:
            AccessKeyId: ${config('AccessKey')}
            SecretAccessKey: ${config('SecretKey')}
          MountPoints:
            - Endpoint: http://tos-${vars.region}.ivolces.com
              BucketName: dcc-bj-video-cut-inout
              BucketPath: /feishu_movie_output/
              LocalMountPath: /mnt/auto/feishu_movie_output/
              ReadOnly: false
      triggers:
        - TriggerName: apig-trigger
          TriggerType: apig
          GatewayId: "gcp1jht7vgc9hjb8nftb0" # todo: 新建 apig 后填写 gatewayId 即可
          # ServiceName: "service-songclone"
          # UpstreamName: "upstream-songclone"
          ServiceName: "service-transnetv2"
          UpstreamName: "upstream-transnetv2"
          RouteName: default
          Path: "/"
          Method:
            - POST
            - GET
            - PUT
            - DELETE
            - HEAD
            - OPTIONS
            - CONNECT
          AdvancedSetting:
            CorsPolicySetting:
              Enable: true